<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bit-0110 — ビット演算パズル</title>
<meta name="description" content="0と1の4桁bitを操作して悪ブロックを撃破するパズルゲーム。">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><text x='16' y='22' font-size='14' font-family='monospace' fill='%237ee787' text-anchor='middle'>01</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1 class="title"><span class="title-bit">bit</span>-0110</h1>
  <div class="topbar-actions">
    <button id="btn-home" class="btn btn-ghost" type="button">ホーム</button>
    <button id="btn-help" class="btn btn-ghost" type="button">あそびかた</button>
    <button id="btn-stages" class="btn btn-ghost" type="button">ステージ</button>
  </div>
</header>

<main class="layout">

  <section class="stage-head">
    <div class="stage-no">STAGE <span id="stage-no">1</span> / <span id="stage-total">-</span><span id="world-name" class="world-name"></span></div>
    <h2 id="stage-name" class="stage-name">はじめてのOR</h2>
    <p id="stage-tip" class="stage-tip"></p>
  </section>

  <section class="board-wrap">
    <div id="board" class="board" aria-label="パズル盤面"></div>
    <div id="drag-ghost" class="drag-ghost" hidden></div>
  </section>

  <section class="statusbar">
    <div class="counters">
      <span class="counter">手数 <b id="move-count">0</b></span>
      <span class="counter">最短 <b id="par-count">-</b></span>
      <span class="counter">残り悪 <b id="bad-count">0</b></span>
    </div>
    <p id="preview" class="preview">&nbsp;</p>
  </section>

  <section class="controls">
    <button id="btn-undo" class="btn" type="button">もどす</button>
    <button id="btn-reset" class="btn" type="button">やりなおし</button>
    <button id="btn-hint" class="btn" type="button">ヒント</button>
  </section>

</main>

<!-- クリア -->
<div id="clear-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="clear-mark">CLEAR</div>
    <div id="clear-star" class="clear-star"></div>
    <p id="clear-text" class="clear-text"></p>
    <div class="modal-actions">
      <button id="btn-replay" class="btn" type="button">もう一度</button>
      <button id="btn-next" class="btn btn-primary" type="button">次のステージ</button>
    </div>
  </div>
</div>

<!-- ゲームオーバー（詰み） -->
<div id="over-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="over-mark">GAME OVER</div>
    <p class="over-text">詰みです。<br>この盤面では、もう悪ブロックを全部は倒せません。</p>
    <div class="modal-actions over-actions">
      <button id="btn-over-stages" class="btn" type="button">ステージ選択</button>
      <button id="btn-over-retry" class="btn btn-primary" type="button">やりなおす</button>
    </div>
    <button id="btn-over-undo" class="btn btn-small over-undo" type="button">1手もどす</button>
  </div>
</div>

<!-- ステージ選択 -->
<div id="stage-modal" class="modal" hidden>
  <div class="modal-card modal-card-stages">
    <h3 class="modal-title">ステージ選択</h3>
    <div id="stage-list" class="stage-list"></div>
    <div class="modal-actions">
      <button id="btn-stage-close" class="btn" type="button">とじる</button>
    </div>
  </div>
</div>

<!-- チュートリアル -->
<div id="tutorial-modal" class="modal" hidden>
  <div class="modal-card modal-card-tutorial">
    <div id="tut-badge" class="tut-badge"></div>
    <div id="tut-kicker" class="tut-kicker"></div>
    <h3 id="tut-title" class="tut-title"></h3>
    <div id="tut-demo" class="tut-demo"></div>
    <p id="tut-text" class="tut-text"></p>
    <div class="tut-loopbar">
      <div id="tut-loop" class="tut-loop"><div id="tut-loop-fill" class="tut-loop-fill"></div></div>
      <button id="btn-tut-replay" class="tut-replay" type="button" title="もう一度再生">↻</button>
    </div>
    <div id="tut-dots" class="tut-dots"></div>
    <div class="modal-actions">
      <button id="btn-tut-skip" class="btn btn-small" type="button">スキップ</button>
      <button id="btn-tut-prev" class="btn" type="button">もどる</button>
      <button id="btn-tut-next" class="btn btn-primary" type="button">次へ</button>
    </div>
  </div>
</div>

<!-- あそびかた（チュートリアル一覧） -->
<div id="help-modal" class="modal" hidden>
  <div class="modal-card">
    <h3 class="modal-title">あそびかた</h3>
    <div id="help-list" class="help-list"></div>
    <div class="modal-actions">
      <button id="btn-help-close" class="btn btn-primary" type="button">とじる</button>
    </div>
  </div>
</div>

<!-- ホーム画面 -->
<div id="home-screen" class="home" hidden>
  <div class="home-inner">
    <h1 class="home-title"><span class="title-bit">bit</span>-0110</h1>
    <p class="home-sub">0と1で悪を消すパズル・全<span id="home-total">310</span>ステージ</p>

    <div class="home-stats">
      <span class="home-stat"><b id="home-cleared">0</b><span>クリア</span></span>
      <span class="home-stat home-stat-gold"><b id="home-gold">0</b><span>★ 最短</span></span>
      <span class="home-stat home-stat-blue"><b id="home-blue">0</b><span>★ クリア</span></span>
    </div>

    <div class="home-menu">
      <button id="btn-home-continue" class="btn btn-primary home-btn" type="button">
        <span id="home-continue-label">はじめる</span>
        <small id="home-continue-sub">STAGE 1</small>
      </button>
      <button id="btn-home-stages" class="btn home-btn" type="button">ステージ選択</button>
      <button id="btn-home-help" class="btn home-btn" type="button">あそびかた</button>
    </div>
  </div>
</div>

<footer class="footer">bit-0110 — 0と1で悪を消すパズル・全310ステージ</footer>

<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
