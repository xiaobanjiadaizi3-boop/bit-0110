<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bit-0110 — ビット演算パズル</title>
<meta name="description" content="0と1の4桁bitを操作して悪ブロックを撃破するパズルゲーム。">
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bit-0110">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
<script>
/* テーマは描画前に当てる（切り替わりのチラつき防止） */
(function () {
  var m = 'auto';
  try { m = localStorage.getItem('bit0110.theme') || 'auto'; } catch (e) {}
  var light = m === 'light' || (m === 'auto' && window.matchMedia &&
    matchMedia('(prefers-color-scheme: light)').matches);
  var r = document.documentElement;
  r.setAttribute('data-theme', light ? 'light' : 'dark');
  r.setAttribute('data-theme-mode', m);
})();
</script>
</head>
<body>

<header class="topbar">
  <h1 class="title"><span class="title-bit">bit</span>-0110</h1>
  <div class="topbar-actions">
    <button id="btn-home" class="icon-btn" type="button" title="ホーム" aria-label="ホーム">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 11.2 12 4l8.4 7.2"/><path d="M6 10.4V20h12v-9.6"/></svg>
    </button>
    <button id="btn-help" class="icon-btn" type="button" title="あそびかた" aria-label="あそびかた">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M9.4 9.4a2.7 2.7 0 1 1 3.4 2.6c-.6.2-.9.7-.9 1.4v.5"/><circle cx="11.9" cy="17" r="1.15" class="ic-dot"/></svg>
    </button>
    <button id="btn-stages" class="icon-btn" type="button" title="ステージ選択" aria-label="ステージ選択">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
    </button>
    <button id="btn-theme" class="icon-btn" type="button" title="画面の明るさ" aria-label="画面の明るさ">
      <svg class="ic-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.2 12H1.8M22.2 12h-2.4M6.5 6.5 4.8 4.8M19.2 19.2l-1.7-1.7M17.5 6.5l1.7-1.7M4.8 19.2l1.7-1.7"/></svg>
      <svg class="ic-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z"/></svg>
      <svg class="ic-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" class="ic-fill"/></svg>
    </button>
  </div>
</header>

<main class="layout">

  <section class="stage-head">
    <div class="stage-no"><span class="stage-word">STAGE</span> <span id="stage-no">1</span> <span class="stage-of">/ <span id="stage-total">-</span></span><span id="world-name" class="world-name"></span></div>
    <p id="stage-tip" class="stage-tip"></p>
  </section>

  <section class="board-wrap">
    <div id="board" class="board" aria-label="パズル盤面"></div>
    <div id="drag-ghost" class="drag-ghost" hidden></div>
  </section>

  <section class="statusbar">
    <p id="preview" class="preview">&nbsp;</p>
  </section>

  <section class="controls">
    <button id="btn-undo" class="ctrl-btn" type="button" title="1手もどす" aria-label="1手もどす">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 9.6h10.4a5.2 5.2 0 0 1 0 10.4H8.6"/><path d="M7.8 5 3.4 9.6 7.8 14"/></svg>
    </button>
    <button id="btn-reset" class="ctrl-btn" type="button" title="やりなおし" aria-label="やりなおし">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 12a8.2 8.2 0 1 1-2.6-6"/><path d="M20.6 3.6v4.6h-4.6"/></svg>
    </button>
  </section>

</main>

<!-- クリア -->
<div id="clear-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="clear-mark">CLEAR</div>
    <p id="clear-text" class="clear-text"></p>
    <div class="modal-actions">
      <button id="btn-replay" class="btn" type="button">もう一度</button>
      <button id="btn-next" class="btn btn-primary" type="button">次のステージ</button>
    </div>
  </div>
</div>

<!-- ゲームオーバー（詰み） -->
<div id="over-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="over-mark">GAME OVER</div>
    <p class="over-text">詰みです。<br>この盤面では、もう悪ブロックを全部は倒せません。</p>
    <div class="modal-actions over-actions">
      <button id="btn-over-stages" class="btn" type="button">ステージ選択</button>
      <button id="btn-over-retry" class="btn btn-primary" type="button">やりなおす</button>
    </div>
    <button id="btn-over-undo" class="btn btn-small over-undo" type="button">1手もどす</button>
  </div>
</div>

<!-- ステージ選択 -->
<div id="stage-modal" class="modal" hidden>
  <div class="modal-card modal-card-stages">
    <h3 class="modal-title">ステージ選択</h3>
    <div id="stage-list" class="stage-list"></div>
    <div class="modal-actions">
      <button id="btn-stage-close" class="btn" type="button">とじる</button>
    </div>
  </div>
</div>

<!-- チュートリアル -->
<div id="tutorial-modal" class="modal" hidden>
  <div class="modal-card modal-card-tutorial">
    <div class="tut-left">
      <div id="tut-badge" class="tut-badge"></div>
      <div id="tut-kicker" class="tut-kicker"></div>
      <h3 id="tut-title" class="tut-title"></h3>
      <div id="tut-demo" class="tut-demo"></div>
    </div>
    <div class="tut-right">
    <p id="tut-text" class="tut-text"></p>
    <div class="tut-loopbar">
      <div id="tut-loop" class="tut-loop"><div id="tut-loop-fill" class="tut-loop-fill"></div></div>
      <button id="btn-tut-replay" class="btn btn-small tut-replay" type="button">
        <span aria-hidden="true">↻</span> もう一度
      </button>
    </div>
    <div id="tut-dots" class="tut-dots"></div>
    <div class="modal-actions">
      <button id="btn-tut-skip" class="btn btn-small" type="button">スキップ</button>
      <button id="btn-tut-prev" class="btn" type="button">もどる</button>
      <button id="btn-tut-next" class="btn btn-primary" type="button">次へ</button>
    </div>
    </div>
  </div>
</div>

<!-- あそびかた（チュートリアル一覧） -->
<div id="help-modal" class="modal" hidden>
  <div class="modal-card">
    <h3 class="modal-title">あそびかた</h3>
    <div id="help-list" class="help-list"></div>
    <div class="modal-actions">
      <button id="btn-help-close" class="btn btn-primary" type="button">とじる</button>
    </div>
  </div>
</div>

<!-- ホーム画面 -->
<div id="home-screen" class="home" hidden>
  <div class="home-inner">
    <h1 class="home-title"><span class="title-bit">bit</span>-0110</h1>
    <p class="home-sub">0と1で悪を消すパズル・全<span id="home-total">310</span>ステージ</p>

    <div class="home-stats">
      <span class="home-stat"><b id="home-cleared">0</b><span>クリア</span></span>
      <span class="home-stat"><b id="home-total-stat">310</b><span>ステージ</span></span>
    </div>

    <div class="home-menu">
      <button id="btn-home-continue" class="btn btn-primary home-btn" type="button">
        <span id="home-continue-label">はじめる</span>
        <small id="home-continue-sub">STAGE 1</small>
      </button>
      <button id="btn-home-stages" class="btn home-btn" type="button">ステージ選択</button>
      <button id="btn-home-help" class="btn home-btn" type="button">あそびかた</button>
    </div>
  </div>

  <button id="btn-home-theme" class="home-theme" type="button" aria-label="画面の明るさ">
    <svg class="ic-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.2 12H1.8M22.2 12h-2.4M6.5 6.5 4.8 4.8M19.2 19.2l-1.7-1.7M17.5 6.5l1.7-1.7M4.8 19.2l1.7-1.7"/></svg>
    <svg class="ic-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z"/></svg>
    <svg class="ic-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" class="ic-fill"/></svg>
    <span id="home-theme-name">自動</span>
  </button>
  <button id="btn-reset-data" class="home-reset" type="button">データを初期化</button>
</div>

<!-- 画面の明るさ -->
<div id="theme-modal" class="modal" hidden>
  <div class="modal-card">
    <h3 class="modal-title">画面の明るさ</h3>
    <div class="theme-list">
      <button class="theme-item" type="button" data-mode="light">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.2 12H1.8M22.2 12h-2.4M6.5 6.5 4.8 4.8M19.2 19.2l-1.7-1.7M17.5 6.5l1.7-1.7M4.8 19.2l1.7-1.7"/></svg>
        <span class="theme-name">ライト</span>
      </button>
      <button class="theme-item" type="button" data-mode="dark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z"/></svg>
        <span class="theme-name">ダーク</span>
      </button>
      <button class="theme-item" type="button" data-mode="auto">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" class="ic-fill"/></svg>
        <span class="theme-name">自動</span>
        <span class="theme-note">端末の設定に合わせる</span>
      </button>
    </div>
    <div class="modal-actions">
      <button id="btn-theme-close" class="btn btn-primary" type="button">とじる</button>
    </div>
  </div>
</div>

<!-- データ初期化の確認 -->
<div id="reset-modal" class="modal" hidden>
  <div class="modal-card">
    <h3 class="modal-title">データを初期化</h3>
    <p class="reset-text">
      クリア状況・獲得した星・チュートリアルの表示履歴を<b>すべて消して</b>、
      最初から遊べる状態に戻します。<br>この操作は取り消せません。
    </p>
    <div class="modal-actions">
      <button id="btn-reset-cancel" class="btn" type="button">やめる</button>
      <button id="btn-reset-confirm" class="btn btn-danger" type="button">初期化する</button>
    </div>
  </div>
</div>

<footer class="footer">bit-0110 — 0と1で悪を消すパズル・全310ステージ</footer>

<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
